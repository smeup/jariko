name: Unit Test

on:
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: 11
        distribution: zulu
    - uses: gradle/actions/setup-gradle@v6.2.0
    - name: Checking kotlin formatting
      run: ./gradlew ktlintCheck
    - name: Compiling and test
      run: ./gradlew check